<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f9; }
        header { background: #222; color: white; padding: 15px; text-align: center; }
        .container { max-width: 800px; margin: 30px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, button, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <header>
        <h1>⚙️ Admin Command Center</h1>
    </header>
    <div class="container">
        <h2>Create New Campus Event</h2>
        <form onsubmit="alert('Event Created Successfully!'); return false;">
            <label>Event Name:</label>
            <input type="text" placeholder="e.g., Cultural Fest 2026" required>
            
            <label>Event Category:</label>
            <select>
                <option>Technical</option>
                <option>Cultural</option>
                <option>Sports</option>
            </select>
            
            <label>Allocated Budget ($):</label>
            <input type="number" placeholder="e.g., 5000" required>
            
            <button type="submit">Publish Event</button>
        </form>
        <p><a href="index.html">← Back to Homepage</a></p>
    </div>
</body>
</html>
